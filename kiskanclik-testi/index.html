<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yüzde kaç kıskançsın?</title>
<style>*{box-sizing:border-box}body{background:#fff8f2;color:#38262e;font:17px/1.5 'DM Sans',system-ui,sans-serif;margin:0}main{max-width:620px;margin:5vh auto;padding:24px}h1{font: bold clamp(37px,8vw,60px)/1.05 Georgia,serif;letter-spacing:-2px}h2{font-size:23px}button,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #d5bbc4}button{cursor:pointer;background:white;color:inherit;margin:4px 0}button:hover{border-color:#903654}button:focus-visible,input:focus-visible{outline:3px solid #ae5577}button.active,.primary{background:#833551;color:white}button:disabled{opacity:.5}section{padding:20px;background:white;border:1px solid #ead7da;border-radius:18px;margin:16px 0}.choice,input{width:100%;margin-bottom:6px;text-align:left}.row{display:grid;grid-template-columns:1fr 72px;gap:8px}progress{width:100%;accent-color:#833551}small{color:#694b57}output{font: bold 56px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap}</style>
<main><h1>Yüzde kaç kıskançsın?</h1><div id="panel"></div></main>
<script id="seed" type="application/json">null</script><script>
const panel=document.querySelector('#panel');
const labels=['Hiç kıskanmam','Biraz kıskanırım','Orta derecede kıskanırım','Bayağı kıskanırım','Çok kıskanırım'];
const scenes=['Kafede yan masadan biri sevgiline “Gülüşün çok güzel” dedi.','Sevgilin eskiden hoşlandığı birinin yeni fotoğrafını beğendi.','Sevgilin ve bir arkadaşı sadece ikisinin anladığı eski bir şakaya güldü.','Sevgilin bir iş arkadaşının esprisini eve gelince hâlâ gülerek anlatıyor.','Eski sevgilisi doğum gününde mesaj attı. Sevgilin yanında “Teşekkür ederim 😊” diye cevap verdi.','Bir düğünde sevdiğiniz şarkı çalarken başka biri sevgilini dansa kaldırdı.','Sevgilin bir arkadaşıyla baş başa konsere gidiyor.','Sevgilin dizideki oyuncu için “Tam benim tipim” dedi.'];
const seed=document.querySelector('#seed');
let questions=JSON.parse(seed.textContent)||scenes.map(title=>({title,options:labels.map((label,score)=>({label,score}))}));
const key='kiskanclik.v1.'+location.pathname;
try{questions=JSON.parse(localStorage.getItem(key))||questions}catch{}
let step,answers,draft;
function el(tag,text,parent=panel){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function button(text,fn,parent=panel,cls=''){const b=el('button',text,parent);b.onclick=fn;b.className=cls;return b}
function clear(){panel.replaceChildren()}
function home(){clear();el('p',questions.length+' durum. Her birinde ilk anda ne kadar kıskançlık hissederdin?');button('Teste başla',()=>{step=0;answers=[];play()},panel,'primary');el('p','');button('Soruları ve şıkları düzenle',edit);button('Testi dosya olarak indir',download)}
function play(){clear();el('small','Soru '+(step+1)+' / '+questions.length);const progress=el('progress','');progress.max=questions.length;progress.value=step+1;const q=questions[step],card=el('section','');el('h2',q.title,card);
q.options.forEach((o,i)=>{const b=button(o.label,()=>{answers[step]=i;play()},card,'choice'+(answers[step]===i?' active':''));b.setAttribute('aria-pressed',answers[step]===i)});
const nav=el('nav','');button('Geri',()=>{if(step){step--;play()}else home()},nav);button(step===questions.length-1?'Sonucumu gör':'Sonraki soru',()=>{if(++step===questions.length)result();else play()},nav,'primary').disabled=answers[step]===undefined}
function result(){clear();let total=0,min=0,max=0;questions.forEach((q,i)=>{const scores=q.options.map(o=>o.score);total+=scores[answers[i]];min+=Math.min(...scores);max+=Math.max(...scores)});el('h2','Bu turdaki sonucun');el('output','%'+Math.round(100*(total-min)/(max-min)));el('p','En çok hangi soruda farklı cevap verdiğinizi merak ettin?');button('Başa dön',home)}
function edit(){draft=structuredClone(questions);drawEditor()}
function field(parent,value,label,type,change){const input=el('input','',parent);input.type=type;input.value=value;input.setAttribute('aria-label',label);input.required=true;if(type==='number'){input.min=0;input.max=100;input.step=1}input.oninput=()=>change(input.value);return input}
function drawEditor(){clear();el('h2','Testi düzenle');el('p','Her şık için 0–100 arasında puan gir. Yüksek puan, daha yoğun kıskançlığı ifade eder.');
draft.forEach((q,i)=>{const card=el('section','');el('h3','Soru '+(i+1),card);field(card,q.title,'Soru metni','text',v=>q.title=v);el('small','Şık metni ve puanı',card);q.options.forEach((o,j)=>{const row=el('div','',card);row.className='row';field(row,o.label,'Şık '+(j+1),'text',v=>o.label=v);field(row,o.score,'Şık puanı','number',v=>o.score=v===''?'':Number(v))});button('Şık ekle',()=>{q.options.push({label:'',score:0});drawEditor()},card);if(q.options.length>2)button('Son şıkkı kaldır',()=>{q.options.pop();drawEditor()},card);if(draft.length>1)button('Soruyu kaldır',()=>{draft.splice(i,1);drawEditor()},card)});
button('Soru ekle',()=>{draft.push({title:'',options:[{label:'',score:0},{label:'',score:1}]});drawEditor();panel.querySelector('section:last-of-type input').focus()});button('Kaydet',()=>{for(const input of panel.querySelectorAll('input')){if(!input.reportValidity())return;if(!input.value.trim()){input.focus();return}}if(!draft.some(q=>new Set(q.options.map(o=>o.score)).size>1)){alert('En az bir soruda iki farklı puan kullan.');return}questions=draft;try{localStorage.setItem(key,JSON.stringify(questions))}catch{alert('Kalıcı kayıt için testi dosya olarak indir.')}home()},panel,'primary');button('Vazgeç',home)}
function download(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#panel').replaceChildren();copy.querySelector('#seed').textContent=JSON.stringify(questions).replaceAll('<','\\u003c');const url=URL.createObjectURL(new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='bizim-testimiz.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
home()
</script></html>
